name: 代码问题
description: 让 Claude 写代码、改代码或排查报错
title: "[代码] "
labels: ["代码"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 在做什么？用什么语言、框架？
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 要求
      description: 想实现什么功能，或者要修什么问题？
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: 相关代码 / 报错信息
      render: text
