name: 日常询问
description: 问 Claude 日常问题
title: "[询问] "
labels: ["日常询问"]
body:
  - type: dropdown
    id: model
    attributes:
      label: 用哪个模型回答
      description: 不确定就选默认。各模型的区别见 README。
      options:
        - Claude Opus 5.5（默认，推荐）
        - Claude Sonnet 5.5
        - Claude Haiku 5.5
        - Claude Fable 5.2（需额外付费，见 README）
      default: 0
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么想问这个？
  - type: textarea
    id: question
    attributes:
      label: 问题
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: 希望的回答形式
      options:
        - 简短结论
        - 详细解释
        - 列要点
        - 都可以
      default: 3
